[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceback-ai"
version = "0.1.0"
description = "AI-assisted incident investigation: evidence-backed root-cause hypotheses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracebackai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
